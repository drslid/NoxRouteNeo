name: Container images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - .github/workflows/container-images.yml
      - .dockerignore
      - apps/**
      - packages/**
      - services/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Each platform is built natively on a matching runner (no QEMU) and pushed
  # by digest only. The `merge` job below stitches the per-platform digests
  # into a single multi-architecture manifest list and applies the tags.
  # See https://docs.docker.com/build/ci/github-actions/multi-platform/
  build:
    name: ${{ matrix.title }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - noxrouteneo-web
          - noxrouteneo-runtime
          - noxrouteneo-traffic-gateway
          - noxrouteneo-security-agent
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - package: noxrouteneo-web
            title: Web
            dockerfile: apps/web/Dockerfile
            description: NoxRouteNeo administration and user web application
          - package: noxrouteneo-runtime
            title: Runtime
            dockerfile: services/runtime/Dockerfile
            description: NoxRouteNeo Xray runtime and control plane agent
          - package: noxrouteneo-traffic-gateway
            title: Traffic Gateway
            dockerfile: services/traffic-gateway/Dockerfile
            description: NoxRouteNeo traffic admission and bandwidth gateway
          - package: noxrouteneo-security-agent
            title: Security Agent
            dockerfile: services/security-agent/Dockerfile
            description: NoxRouteNeo host firewall security agent
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare platform identifier
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.package }}
          labels: |
            org.opencontainers.image.title=NoxRouteNeo ${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.package }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.package }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.package }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.title }} manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Web
            package: noxrouteneo-web
          - title: Runtime
            package: noxrouteneo-runtime
          - title: Traffic Gateway
            package: noxrouteneo-traffic-gateway
          - title: Security Agent
            package: noxrouteneo-security-agent

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.package }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.package }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create and push multi-architecture manifest
        working-directory: ${{ runner.temp }}/digests
        run: >-
          docker buildx imagetools create
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.package }}@sha256:%s ' *)

      - name: Inspect published manifest
        run: >-
          docker buildx imagetools inspect
          "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.package }}:${{ steps.meta.outputs.version }}"
